<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FF Glory Bot - XH SHAWON</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- LOGIN SCREEN -->
  <div id="loginScreen" class="login-container">
    <div class="login-box">
      <h1>🔥 XH SHAWON</h1>
      <p>Free Fire Glory Bot</p>
      <div class="input-group">
        <input type="text" id="username" placeholder="Username" />
      </div>
      <div class="input-group">
        <input type="password" id="password" placeholder="Password" />
      </div>
      <button id="loginBtn" class="btn primary">Login</button>
      <p id="loginError" class="error-msg"></p>
    </div>
  </div>

  <!-- MAIN APP (Hidden initially) -->
  <div class="app" id="mainApp" style="display: none;">
    <header class="header">
      <h1>🔥 Free Fire <span>Glory Bot</span></h1>
      <p class="subtitle">Advanced Auto Guild Join & Match System</p>
      <button id="logoutBtn" class="btn small danger" style="margin-top: 10px;">Logout</button>
    </header>

    <!-- Scoreboard -->
    <section class="scoreboard">
      <div class="score-card total">
        <span class="label">🏆 Squad Total Glory</span>
        <span id="totalGlory" class="value">0</span>
      </div>
      <div class="score-card">
        <span class="label">🎯 Active Bots</span>
        <span id="activeBots" class="value">0</span>
      </div>
      <div class="score-card">
        <span class="label">🛡️ Guild Status</span>
        <span id="guildStatus" class="value small">Not Connected</span>
      </div>
      <div class="score-card">
        <span class="label">🆔 Guild UID</span>
        <span id="guildUidDisplay" class="value small">—</span>
      </div>
    </section>

    <!-- Controls -->
    <section class="controls">
      <h2>⚙️ Setup Configuration</h2>
      <div class="input-group">
        <label for="guildUid">🛡️ Guild UID <span class="required">*</span></label>
        <input type="text" id="guildUid" placeholder="Enter Guild UID (e.g. 3106761922)" maxlength="20" />
        <small id="guildUidHint" class="hint">Guild UID is required for bots to join.</small>
      </div>

      <h2 style="margin-top: 20px;">🎯 Bot Count</h2>
      <div class="mode-buttons">
        <button class="mode-btn" data-count="1">1 Bot (Solo)</button>
        <button class="mode-btn" data-count="2">2 Bots (Duo)</button>
        <button class="mode-btn" data-count="3">3 Bots (Squad)</button>
        <button class="mode-btn" data-count="4">4 Bots (Squad Max)</button>
      </div>

      <div class="action-buttons">
        <button id="startBtn" class="btn primary" disabled>▶ Start Bots</button>
        <button id="stopBtn" class="btn danger" disabled>⏹ Stop</button>
        <button id="resetBtn" class="btn secondary">↻ Reset</button>
      </div>
    </section>

    <!-- Bot Cards -->
    <section class="bots-grid" id="botsGrid"></section>

    <!-- Console -->
    <section class="console-section">
      <div class="console-header">
        <h2>🖥️ Live Console Log</h2>
        <button id="clearConsole" class="btn small">Clear</button>
      </div>
      <div class="console" id="console"></div>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
