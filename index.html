<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🔥 Free Fire Glory Bot Simulator v2</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <!-- Header -->
    <header class="header">
      <h1>🔥 Free Fire <span>Glory Bot</span> Simulator</h1>
      <p class="subtitle">Guild UID Required • Auto Account • Battle Royale Glory Push</p>
    </header>

    <!-- Scoreboard -->
    <section class="scoreboard">
      <div class="score-card total">
        <span class="label">🏆 Total Glory</span>
        <span id="totalGlory" class="value">0</span>
      </div>
      <div class="score-card">
        <span class="label">🎯 Active Bots</span>
        <span id="activeBots" class="value">0</span>
      </div>
      <div class="score-card">
        <span class="label">🛡️ Guild Status</span>
        <span id="guildStatus" class="value small">Not Joined</span>
      </div>
      <div class="score-card">
        <span class="label">🆔 Guild UID</span>
        <span id="guildUidDisplay" class="value small">—</span>
      </div>
      <div class="score-card">
        <span class="label">🎮 Match Mode</span>
        <span id="matchMode" class="value small">—</span>
      </div>
    </section>

    <!-- Guild UID + Controls -->
    <section class="controls">
      <h2>⚙️ Setup</h2>

      <div class="input-group">
        <label for="guildUid">🛡️ Guild UID <span class="required">*</span></label>
        <input
          type="text"
          id="guildUid"
          placeholder="যেমন: 3051234567"
          maxlength="20"
        />
        <small id="guildUidHint" class="hint">Guild UID না দিলে bot guild-এ join করতে পারবে না।</small>
      </div>

      <h2 style="margin-top: 20px;">🎯 Select Mode</h2>
      <div class="mode-buttons">
        <button class="mode-btn" data-count="1">1 Bot (Solo)</button>
        <button class="mode-btn" data-count="2">2 Bots (Duo)</button>
        <button class="mode-btn" data-count="3">3 Bots (Squad)</button>
        <button class="mode-btn" data-count="4">4 Bots (Squad Max)</button>
      </div>

      <div class="action-buttons">
        <button id="startBtn" class="btn primary" disabled>▶ Start Match</button>
        <button id="stopBtn" class="btn danger" disabled>⏹ Stop</button>
        <button id="resetBtn" class="btn secondary">↻ Reset</button>
      </div>
    </section>

    <!-- Bot Cards -->
    <section class="bots-grid" id="botsGrid"></section>

    <!-- Console -->
    <section class="console-section">
      <div class="console-header">
        <h2>🖥️ Live Console</h2>
        <button id="clearConsole" class="btn small">Clear</button>
      </div>
      <div class="console" id="console"></div>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
